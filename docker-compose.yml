services:
  backend:
    build: ./backend
    container_name: mvp_fastapi_backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - "${COMFYUI_HOST_OUTPUT_DIR}:/comfy_output"
      # Read-WRITE (2026-09-09, widened from read-only the same day) —
      # apis/ollama_admin.py both lists model files an owner dropped into
      # ./models (see models/README.md) AND, as of the URL-download
      # feature, downloads a model file INTO this folder itself
      # (server-side fetch, so it works from a remote/EC2-style
      # deployment where the owner has no shell access to drop a file in
      # manually). The bundled `ollama` service below only ever needs to
      # READ a file here to import it, so its own mount stays read-only.
      - ./models:/models
    environment:
      - DATABASE_URL=postgresql://my_user:my_password@postgres-db:5432/my_mvp_db
      # Points at the BUNDLED `ollama` service below (2026-09-09), not
      # host.docker.internal — Ollama now runs as its own container on
      # this same Docker network, not something the owner installs on
      # their host machine. See apis/ollama_admin.py's docstring and the
      # root AGENTS.md's "First-run setup wizard" section for why this
      # is what makes automated "pick a model -> it downloads -> it's
      # ready" possible at all (a containerized backend has no way to
      # install/run anything on the host OS, but it CAN make a plain
      # HTTP call to another container on its own network).
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text
      # Shared with the owner-agent service below — same default as
      # backend/auth.py's own hardcoded fallback, made explicit here so
      # there's one source of truth for the two services' shared secret
      # instead of two independently-hardcoded Python literals that happen
      # to match today and could silently drift apart later.
      - JWT_SECRET=${JWT_SECRET:-dev-only-insecure-secret-change-me}
      # Everything below composes from the atomic values in .env (see
      # .env.example) rather than being hardcoded — none of these are
      # actually fixed: ComfyUI could be swapped for a different SD
      # backend, a portable ComfyUI install can move, and host/ports
      # differ per machine. Same "swappable, not hardcoded" principle
      # already applied to the chat/embedding AI providers — see the root
      # AGENTS.md's CTE section.
      # Reachable *from inside this container* (server-side calls).
      - COMFYUI_URL=http://${COMFYUI_HOST:-host.docker.internal}:${COMFYUI_PORT:-8188}
      # Reachable *from the browser* — used to build <img> src URLs.
      - COMFYUI_PUBLIC_URL=http://${HOST:-localhost}:${COMFYUI_PORT:-8188}
      - COMFYUI_WS_URL=ws://${COMFYUI_HOST:-host.docker.internal}:${COMFYUI_PORT:-8188}/ws
      - COMFYUI_OUTPUT_DIR=/comfy_output
      # This backend's own browser-facing URL — needed to build absolute
      # URLs for content it serves itself (e.g. CTE media-library
      # uploads, apis/media.py), the same way COMFYUI_PUBLIC_URL does for
      # ComfyUI-served images.
      - BACKEND_PUBLIC_URL=http://${HOST:-localhost}:${BACKEND_PORT:-8000}
      # Where to send a visitor's browser back after a hosted Stripe
      # Checkout session (backend/payments.py) — this backend never
      # renders that redirect itself, it just needs to tell Stripe where
      # to send the visitor once they've paid or cancelled.
      - FRONTEND_PUBLIC_URL=http://${HOST:-localhost}:${FRONTEND_PORT:-3000}
      # Reachable *from inside this container* (apis/seo_audit.py's
      # check_seo_schema — the first backend-initiated call INTO the
      # frontend service; every other cross-service call in this app goes
      # the other direction, frontend calling backend via INTERNAL_API_URL
      # below). Docker DNS, not FRONTEND_PUBLIC_URL — in local dev that
      # resolves to "localhost", which from inside this container means
      # this container itself, not the frontend one. Same
      # internal-vs-public split as COMFYUI_URL/COMFYUI_PUBLIC_URL above.
      - FRONTEND_INTERNAL_URL=http://frontend:3000
      # RAG document uploads (backend/apis/documents.py). Lives under the
      # existing ./backend bind mount (see volumes: below) — no separate
      # named volume needed, and backend/.dockerignore keeps uploaded
      # files from getting baked into the image on rebuild.
      - DOCUMENT_STORAGE_DIR=/app/storage/documents
      # CTE media-library uploads (backend/apis/media.py). Deliberately a
      # *separate* directory from COMFYUI_OUTPUT_DIR above — user uploads
      # shouldn't be tied to wherever the image-gen backend happens to
      # write its own output, since that backend/location can change.
      # Same bind-mount/.dockerignore reasoning as DOCUMENT_STORAGE_DIR.
      - MEDIA_UPLOAD_DIR=/app/storage/media
      - WATCHFILES_FORCE_POLLING=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres-db
      - ollama

  ollama:
    # Bundled local-model runtime (2026-09-09) — official image, no
    # custom build. Confirmed scope with the user: CPU-only by default
    # (no GPU passthrough configured this round); a small/quantized model
    # (see apis/ollama_admin.py's SUGGESTED_MODELS) is still very usable
    # on CPU, just slower than a GPU-accelerated setup.
    image: ollama/ollama:latest
    container_name: mvp_ollama
    ports:
      # 127.0.0.1-bound, not 0.0.0.0 — same reasoning as postgres-db's own
      # port mapping below: backend reaches this over the internal Docker
      # network (ollama:11434) and never needs this mapping at all; it
      # exists purely so the owner can also point their own local `ollama`
      # CLI (if installed) at this same bundled instance for debugging.
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      # Same folder the backend mounts (read-write, above) — Ollama only
      # ever needs to READ a file here to import it via `FROM
      # /models/<file>.gguf` in a Modelfile, so its own mount stays
      # read-only even though the backend's no longer is.
      - ./models:/models:ro

  frontend:
    build: ./frontend
    container_name: mvp_nextjs_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      # Consumed by the browser, not the Next.js server — see HOST's
      # comment in .env.example: both containers publish their ports to
      # the host, and the browser reaches them from outside Docker's
      # network entirely.
      - NEXT_PUBLIC_API_URL=http://${HOST:-localhost}:${BACKEND_PORT:-8000}
      # Consumed by Next.js Server Components (running inside this
      # container) — "backend" is the other service's docker-compose name,
      # resolved via Docker's internal DNS. See lib/api.ts's comment: this
      # is NOT interchangeable with NEXT_PUBLIC_API_URL above, and isn't
      # HOST/BACKEND_PORT-derived for the same reason.
      - INTERNAL_API_URL=http://backend:8000
      # Owner Agent panel calls this origin directly from the browser (no
      # SSR fetch involved), so only the NEXT_PUBLIC_ variant is needed —
      # see frontend/src/lib/owner-agent.ts.
      - NEXT_PUBLIC_OWNER_AGENT_URL=http://${HOST:-localhost}:${OWNER_AGENT_PORT:-8100}
      # This site's own public origin (2026-08-21) — needed for absolute
      # URLs in sitemap.ts/robots.ts and as the JSON-LD "url" fallback
      # when no business_url is configured. Same composition as
      # NEXT_PUBLIC_API_URL above and backend's own FRONTEND_PUBLIC_URL
      # (docker-compose's backend service) — all three describe the same
      # externally-reachable address, just consumed by different sides.
      - NEXT_PUBLIC_SITE_URL=http://${HOST:-localhost}:${FRONTEND_PORT:-3000}
    depends_on:
      - backend

  owner-agent:
    build: ./owner-agent
    container_name: mvp_owner_agent
    ports:
      - "${OWNER_AGENT_PORT:-8100}:8100"
    volumes:
      - ./owner-agent:/app
      - ./owner-agent/logs:/app/logs
    environment:
      - JWT_SECRET=${JWT_SECRET:-dev-only-insecure-secret-change-me}
      # Docker DNS, server-to-server — same principle as the frontend's
      # INTERNAL_API_URL, not the HOST-based publicly-reachable URL: this
      # service calls backend from inside the Compose network, never from
      # a browser.
      - BACKEND_URL=http://backend:8000
      - CORS_ALLOW_ORIGINS=http://${HOST:-localhost}:${FRONTEND_PORT:-3000}
      - WATCHFILES_FORCE_POLLING=true
    depends_on:
      - backend

  postgres-db:
    image: pgvector/pgvector:pg16
    container_name: mvp_postgres_db
    ports:
      # 127.0.0.1-bound, not 0.0.0.0 — backend/owner-agent reach this over
      # Docker's internal network (postgres-db:5432) and never need this
      # mapping at all; it exists purely so a local DB client on this same
      # machine (pgAdmin, DBeaver, psql, ...) can still connect. Binding to
      # every interface would mean anyone who can reach this host's network
      # (LAN, public WiFi, ...) could connect directly with the hardcoded
      # my_user/my_password below and bypass every RBAC/JWT check in the
      # app entirely.
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: my_user
      POSTGRES_PASSWORD: my_password
      POSTGRES_DB: my_mvp_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  # Pulled Ollama models — kept in a named volume, not the bind-mounted
  # ./backend tree, since these are large, machine-specific binary blobs
  # with nothing to do with this app's own source (same reasoning
  # pgdata already gets its own named volume rather than living under a
  # bind mount).
  ollama_data: